# Линтер backend. Задача — ловить настоящие ошибки, а не наводить стиль.
#
# Заведён после регрессии: в WebSocket-цикле обратились к переменной `msg`,
# которой там нет (она называется `message`). NameError уходил в общий
# обработчик, клиент получал «Внутренняя ошибка», а цикл приёма обрывался —
# разговор умирал на первой же реплике. Тесты этого не поймали: они покрывают
# чистую логику и main.py не импортируют.
#
# Набор правил намеренно узкий:
#   F   — pyflakes: необъявленные имена, неиспользуемые импорты и переменные,
#         битые f-строки. Именно F821 поймал бы ту опечатку.
#   B   — типовые ловушки bugbear (например, изменяемое значение по умолчанию).
#
# Стилистику (длина строк, порядок импортов) сознательно не включаем: она дала
# бы 45 замечаний на существующем коде и утопила бы сигнал в шуме.
line-length = 100

[lint]
select = ["F", "B"]
