<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Фавикон podhod.tech — вариант 1a «Монограмма p» из макета
    «Логотип-вкладка.dc.html».

    Буква нарисована контуром, а не текстом с font-family: Manrope, как
    в макете. Фавикон рендерится изолированно, веб-шрифты в него не
    подгружаются — вариант с <text> отрисовался бы системным шрифтом.
    Проверено растеризацией: буква из макета в изоляции даёт 10.7×13.7,
    тогда как настоящая Manrope 800 — 10.0×15.1.

    Пропорции сняты с Manrope 800: ширина 0.525 em, над базовой линией
    0.555, выносник вниз 0.24. Глиф отцентрован в плитке (15.85, 15.95).
  -->
  <rect width="32" height="32" rx="8" fill="#0E7A6E"/>
  <rect x="11" y="8.4" width="3.3" height="15.2" rx="1.65" fill="#fff"/>
  <circle cx="15.9" cy="13.5" r="3.45" fill="none" stroke="#fff" stroke-width="3.3"/>
</svg>
