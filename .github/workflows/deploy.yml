# CI/CD: push в main → сборка образов → автодеплой на оба сервера.
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN — доступ к Docker Hub
#   RU_HOST, DE_HOST                  — адреса серверов
#   DEPLOY_SSH_KEY                    — приватный ключ для входа на оба сервера
#
# Вход только по ключу: парольная аутентификация на серверах отключена.
# Ключ отдельный от личного (комментарий github-actions-deploy в
# authorized_keys), чтобы его можно было отозвать, не трогая доступ людей.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-trainer-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-trainer-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  deploy-de:
    name: Deploy backend (DE)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Pull & restart backend
        uses: appleboy/ssh-action@v1
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.DE_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -euo pipefail
            cd ~/ai-trainer
            # Авторизация в Docker Hub: анонимные загрузки ограничены и при
            # 429 pull молча прерывается, оставляя работать старый образ.
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            # Только образ приложения: redis и прочая инфраструктура меняются
            # редко, но их загрузка тратит лимит и может уронить весь pull.
            docker compose pull backend
            docker compose up -d
            # Контейнер должен работать именно на свежескачанном образе.
            # Без этой проверки неудачный деплой выглядел бы успешным.
            running=$(docker inspect -f '{{.Image}}' "$(docker compose ps -q backend)")
            latest=$(docker image inspect -f '{{.Id}}' "$DOCKERHUB_USERNAME/ai-trainer-backend:latest")
            if [ "$running" != "$latest" ]; then
              echo "Ошибка: backend работает на устаревшем образе"
              exit 1
            fi
            docker image prune -f

  deploy-ru:
    name: Deploy frontend (RU)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      # Конфиги стека кладём с раннера, а не тянем на сервере через git pull.
      # 31.08 GitHub начал пачками отвечать 401 (www-authenticate: Basic) на
      # анонимные git-запросы с российского адреса, и деплой падал на первой же
      # строке скрипта. Раннер в GitHub авторизован и ходит не из России.
      # Код приложения к этому отношения не имеет: он приезжает образом
      # с Docker Hub, а из репозитория серверу нужны ровно эти два файла —
      # описание стека (нужно ДО запуска образа) и маршруты Caddy
      # (монтируются с диска каталогом ./deploy).
      # Сверено 31.08: положенные раннером файлы совпали с прежними до байта
      # (sha256 и размер), Caddy на reload ответил "config is unchanged".
      - name: Положить конфиги стека на сервер
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.RU_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.prod.yml,deploy/Caddyfile"
          target: /root/ai-salesperson-trainer

      - name: Pull & restart stack
        uses: appleboy/ssh-action@v1
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.RU_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,GIT_SHA
          script: |
            set -euo pipefail
            cd ~/ai-salesperson-trainer
            # git pull отсюда убран: сервер больше не ходит в GitHub. Конфиги
            # кладёт шагом выше раннер, код приезжает образом с Docker Hub.
            # Каталог остаётся ради файлов окружения (.env, frontend/.env),
            # но как копия репозитория он протухает — версию сервера смотреть
            # в .deployed-sha, а не в git log.
            #
            # scp разворачивает архив, сохраняя владельца с раннера (uid 1001,
            # такого пользователя на сервере нет). Чтению это не мешает,
            # но владельца возвращаем, чтобы каталог не зарастал чужими uid.
            chown root:root docker-compose.prod.yml deploy/Caddyfile
            echo "$GIT_SHA" > .deployed-sha
            # Авторизация в Docker Hub: анонимные загрузки ограничены и при
            # 429 pull молча прерывается, оставляя работать старый образ.
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            # Только образ приложения: caddy:2 и postgres:16 меняются редко,
            # но их загрузка тратит лимит и может уронить весь pull.
            docker compose -f docker-compose.prod.yml pull frontend
            docker compose -f docker-compose.prod.yml up -d
            # Caddy перечитывает конфиг сам только при пересоздании, а его
            # образ не меняется — контейнер живёт неделями и правки Caddyfile
            # не видит. Перечитывание штатное: соединения не рвутся.
            # Не роняем деплой на сбое: приложение уже выкачено, а прежний
            # маршрут работает — хуже свежего, но лучше упавшего деплоя
            docker compose -f docker-compose.prod.yml exec -T caddy \
              caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile \
              || echo "ВНИМАНИЕ: Caddy не перечитал конфиг — маршруты остались прежними"
            # Контейнер должен работать именно на свежескачанном образе.
            # Без этой проверки неудачный деплой выглядел бы успешным.
            running=$(docker inspect -f '{{.Image}}' "$(docker compose -f docker-compose.prod.yml ps -q frontend)")
            latest=$(docker image inspect -f '{{.Id}}' "$DOCKERHUB_USERNAME/ai-trainer-frontend:latest")
            if [ "$running" != "$latest" ]; then
              echo "Ошибка: frontend работает на устаревшем образе"
              exit 1
            fi
            docker image prune -f
